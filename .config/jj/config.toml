#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Joshua Harms"
email = "joshua@nozzlegear.com"

[signing]
key = "678CB5B8"
#behavior = "own"
behavior = "keep"
backend = "gpg"

[git]
sign-on-push = true
# Allows code forges to extract change-ids from commits, and allows jj to track changes across force pushes
write-change-id-header = true

[aliases]
remote-ahead = ["log", "-r", "remote_bookmarks(remote=exact:'origin') ~ ::@"]

short-log = ["log", "-T", 'separate(" ", change_id.shortest(8), coalesce(description.first_line(), description_placeholder)) ++ "\n"']

# Rebase the current bookmark on its upstream (https://oppi.li/posts/configuring_jujutsu/)
tug = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@-"]

# Automatically go to the first reviewable commit
'review' = ["new", "-r", "exactly(roots(review()), 1)"]

# Count the number of commits are available to review
'count-reviews' = ["util", "exec", "--", "bash", "-c", """
set -euo pipefail
# Piping to xargs trims whitespace
jj log -G -r 'review()' | wc -l | xargs
""", ""]

# List any commits in the stack that need to be described
'undescribed' = ["log", "-r", 'undescribed()']

# List the commit's descendants
'descendants' = ["log", "-r", 'descendants(@, 10) | descendants(@-, 9)']
'descendants(n)' = ["log", "-r", 'descendants(@, n) | descendants(@-, n)']
'descendants(c, n)' = ["log", "-r", 'descendants(c, n)']

# List the commit's ancestors
'ancestors' = ["log", "-r", 'ancestors(@, 10)']
'ancestors(n)' = ["log", "-r", 'ancestors(@, n)']
'ancestors(c, n)' = ["log", "-r", 'ancestors(c, n)']

[ui]
diff-formatter = "difft"
merge-editor = ":builtin"

[merge-tools.difft]
program = "difft"
diff-args = ["--color=always", "$left", "$right"]

[template-aliases]
"format_timestamp(timestamp)" = "timestamp.ago()"

[templates]
log = """
separate(" ",
  if(root, "root()"),
  if(divergent, change_id.shortest(8) ++ label("conflict", "/" ++ change_offset), change_id.shortest(8)),
  committer.timestamp().ago(),
  if(bookmarks, ("[" ++ bookmarks ++ "]")),
  if(empty, label("empty", "(empty)")),
  coalesce(description.first_line(), description_placeholder),
  if(conflict, label("conflict", "conflict")),
  if(!mine, author.name()),
) ++ "\n"
"""

[revsets]
# By default, show all my current stacks of work.
log = 'stack(mine() | @) | trunk() | @'

[revset-aliases]
# By default, show the repo trunk, the remote bookmarks, and all remote tags. We
# don't want to change these in most cases, but in some repos it's useful.
'immutable_heads()' = 'present(trunk()) | untracked_remote_bookmarks() | tags()'

# Useful to ignore this, in many repos. For repos like `jj` these are
# consistently populated with a bunch of auto-generated commits, so ignoring it
# is often nice.
'gh_pages()' = 'ancestors(remote_bookmarks(exact:"gh-pages"))'

# Private and WIP commits that should never be pushed anywhere. Often part of
# work-in-progress merge stacks.
'wip()' = 'subject(glob:"wip:*") | subject(glob:"wip *") | subject(glob:"WIP *")'
'private()' = 'subject(glob:"private:*")'
'blacklist()' = 'wip() | private()'

# stack(x, n) is the set of mutable commits reachable from 'x', with 'n'
# parents. 'n' is often useful to customize the display and return set for
# certain operations. 'x' can be used to target the set of 'roots' to traverse,
# e.g. @ is the current stack.
'stack()' = 'stack(@)'
'stack(x)' = 'stack(x, 2)'
'stack(x, n)' = 'ancestors(reachable(x, mutable()), n)'

# The current set of "open" works. It is defined as: all stacks that
# are reachable from my working copy. n = 1, meaning that nothing from
# `trunk()` is included, so all resulting commits are mutable by
# definition.
'open()' = 'stack(@, 1) & mine()'

# the set of 'ready()' commits. defined as the set of open commits, but nothing
# that is blacklisted or any of their children.
'ready()' = 'open() ~ descendants(blacklist())'

# Finds the rev where @ and trunk() forked off
'forkpoint' = 'fork_point(@ | trunk())'

# Find any commits in the stack that have the review prefix
'review()' = 'stack(@, 1) & (subject(glob:"review:*") | subject(glob:"(review)*"))'

# Find any commits in the stack that have git's "fixup!" prefix
'fixup()' = 'stack(@, 1) & subject(regex:"^fixup! ")'

# Find any commits in the stack that have the review prefix
'undescribed()' = 'stack(@, 1) & (subject("") | subject(glob:"describe:*") | subject(glob:"(describe me)*") | subject(glob:"describe me:")) ~ empty()'

# Finds any mutable commit in the stack by the user that haven't been signed
'unsigned()' = '(stack(@, 1) & mine()) ~ signed()'
